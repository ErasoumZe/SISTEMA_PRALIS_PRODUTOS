name: pralis

# Orquestra Postgres + API + PWA. Usado no Coolify (ou localmente para simular produção).
# As variáveis vêm do painel do Coolify (ou de um .env ao lado deste arquivo).

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Postgres 18 grava os dados em /var/lib/postgresql/18/docker (PGDATA mudou
      # nessa versão). O volume precisa cobrir /var/lib/postgresql — montar em
      # .../data deixava os dados na camada efêmera do container e eles sumiam a
      # cada redeploy. Este é o path declarado como VOLUME pela imagem do PG 18.
      - pralis_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: stack/api/Dockerfile
      args:
        # O SHA por dois caminhos: aqui (fica gravado na imagem) e como variável
        # em tempo de execução, logo abaixo. Se o Coolify preencher qualquer um
        # dos dois, /health passa a mostrar o commit; se não preencher nenhum,
        # o `buildTime` do /health ainda diz qual build está no ar.
        SOURCE_COMMIT: ${SOURCE_COMMIT}
    environment:
      NODE_ENV: production
      # Commit publicado, exposto em GET /health. O Coolify define SOURCE_COMMIT;
      # vazio nao e erro, so significa "nao da para saber por aqui".
      SOURCE_COMMIT: ${SOURCE_COMMIT}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA}
      PORT: 3344
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CORS_ORIGIN: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Google Sheets — espelho do cadastro da BASE. Mantenha ENABLED=false até a
      # conta de serviço ter acesso de Editor à planilha (GET /admin/sheets/health confere).
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GOOGLE_SHEETS_BASE_TAB: ${GOOGLE_SHEETS_BASE_TAB}
      GOOGLE_SHEETS_FISCAL_TAB: ${GOOGLE_SHEETS_FISCAL_TAB}
      GOOGLE_SHEETS_DEFAULT_LOJAS: ${GOOGLE_SHEETS_DEFAULT_LOJAS}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      # Aba com os grupos oficiais e a margem padrao de cada um (colunas M e N).
      GOOGLE_SHEETS_GRUPOS_TAB: ${GOOGLE_SHEETS_GRUPOS_TAB}
      # Espelho nas abas de LOJA (TNP e LI; HORA fica fora). Mantenha vazio ate
      # conferir a gravacao de 1 produto por GET /admin/sheets/loja/previsualizar.
      # Vazio ja significa desligado.
      GOOGLE_SHEETS_LOJA_ESPELHO_AUTO: ${GOOGLE_SHEETS_LOJA_ESPELHO_AUTO}
      GOOGLE_SHEETS_LOJA_TABS: ${GOOGLE_SHEETS_LOJA_TABS}
      # Pasta dos CSVs de fonte da Central. Vazio usa os versionados em docs/.
      UNIFICACAO_FONTES_DIR: ${UNIFICACAO_FONTES_DIR}
      # Token exclusivo do robô para POST /vendas/importar (mínimo 32 caracteres).
      VENDAS_IMPORT_TOKEN: ${VENDAS_IMPORT_TOKEN}
      # Criare/SIA — exportação posicional de produtos. Mantenha ENABLED=false até
      # o de-para do SIA estar importado e o GET /admin/creare/health conferido.
      # Variável não definida chega vazia, e vazio já significa desligado.
      CREARE_EXPORT_ENABLED: ${CREARE_EXPORT_ENABLED}
      CREARE_STORE_CONFIG_JSON: ${CREARE_STORE_CONFIG_JSON}
      # Token do robô da loja para GET /creare/produtos.txt (mínimo 32 caracteres).
      # Ausente ou curto desabilita o download por máquina; só sessão de admin exporta.
      CREARE_EXPORT_TOKEN: ${CREARE_EXPORT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    # sem 'ports' no host: o proxy do Coolify roteia pelo domínio (defina API_URL no serviço)
    expose:
      - '3344'
    restart: unless-stopped

  pwa:
    build:
      context: .
      dockerfile: stack/pwa/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: ${API_URL}
    depends_on:
      - api
    # sem 'ports' no host: o proxy do Coolify roteia pelo domínio (defina APP_URL no serviço)
    expose:
      - '3000'
    restart: unless-stopped

volumes:
  pralis_pg:
