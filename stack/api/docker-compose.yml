name: pralis

services:
  postgres:
    image: postgres:18.1-alpine
    container_name: pralis_pg
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pralis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  pralis_pg_data:
